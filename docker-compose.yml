version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: loanrisk-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-loananalytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loanrisk-app
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@db:5432/${DB_NAME:-loananalytics}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-in-production}
      - DATASET_ROWS=5000
      - DATASET_MODE=synthetic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./saved_models:/app/saved_models
      - ./reports:/app/reports

volumes:
  postgres_data:
